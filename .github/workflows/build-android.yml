name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build StockDesk.apk
    # ubuntu-22.04 fijo (no ubuntu-latest): Buildozer/python-for-android
    # necesitan paquetes de sistema estables; versiones de Ubuntu muy
    # recientes rompen algunos repositorios de terceros usados por el
    # toolchain de Android.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev automake \
            autopoint gettext build-essential

      - name: Point JAVA_HOME at JDK 17
        # ubuntu-22.04 GitHub-hosted runners ya traen varios JDKs
        # preinstalados (11, 17, 21...) con JAVA_HOME apuntando por
        # defecto a uno más viejo (11). El Android Gradle Plugin usado
        # por python-for-android requiere Java 17 explícitamente
        # ("Android Gradle plugin requires Java 17 to run. You are
        # currently using Java 11"), confirmado en un build real.
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}" >> "$GITHUB_ENV"

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33 virtualenv

      - name: Copy web app assets into native/android/webapp
        run: python3 native/copy_web_assets.py android

      - name: Copy shared server.py next to main.py
        run: cp native/server.py native/android/server.py

      - name: Accept Android SDK licenses in advance
        run: yes | buildozer android update || true
        working-directory: native/android

      - name: Build with Buildozer
        working-directory: native/android
        run: buildozer -v android debug

      - name: Locate and rename artifact
        run: |
          mkdir -p out
          apk_path=$(find native/android/bin -name "*.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "No se encontró ningún .apk generado" >&2
            exit 1
          fi
          cp "$apk_path" out/StockDesk-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockDesk-android-apk
          path: out/StockDesk-android.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/StockDesk-android.apk
