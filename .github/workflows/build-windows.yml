name: Build Windows App

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build StockDesk.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r native/windows/requirements.txt

      - name: Copy web app assets into native/windows/webapp
        run: python native/copy_web_assets.py windows

      - name: Build one-file executable with PyInstaller
        working-directory: native/windows
        run: pyinstaller --noconfirm build.spec

      - name: Rename artifact with version
        shell: bash
        run: |
          mkdir -p out
          cp native/windows/dist/StockDesk.exe out/StockDesk-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockDesk-windows-exe
          path: out/StockDesk-windows.exe
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/StockDesk-windows.exe
